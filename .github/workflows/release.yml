name: Release

# Semantic versioning + APK release, done at the END (not daily).
# semantic-release reads Conventional Commits since the last tag, computes the
# next version, bumps pubspec.yaml, builds the release APK, creates the git tag
# + GitHub Release, and attaches the APK to that release.
#
# Runs automatically on every merge to main (plus a manual button as backup).
# semantic-release is the guard: a release only happens if there is at least one
# `feat:`/`fix:` commit since the last tag. Pure `chore:`/`docs:` merges produce
# no release, so not every merge builds an APK.
#
# The version-bump commit it pushes back carries "[skip ci]", which GitHub honors
# natively — so that commit does NOT re-trigger this workflow (no infinite loop).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two releases at once — they would fight over the version-bump commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tags, releases, and push the version-bump commit
  issues: write # semantic-release may comment on related issues
  pull-requests: write # ...and on related PRs

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (required by Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.3
          cache: true

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Version-bump commit is authored by the repo owner (no bot watermark).
          GIT_AUTHOR_NAME: fery
          GIT_AUTHOR_EMAIL: adefery221@gmail.com
          GIT_COMMITTER_NAME: fery
          GIT_COMMITTER_EMAIL: adefery221@gmail.com
        run: npx semantic-release
