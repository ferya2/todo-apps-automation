name: Release

# Semantic versioning + APK release, done at the END (not daily).
# semantic-release reads Conventional Commits since the last tag, computes the
# next version, bumps pubspec.yaml, builds the release APK, creates the git tag
# + GitHub Release, and attaches the APK to that release.
#
# Trigger it manually when you want to cut a release. (Switch to push:main later
# if you ever want a release on every merge.)
#
# NOTE: a release only happens if there is at least one `feat:`/`fix:` commit
# since the last tag. Pure `chore:`/`docs:` commits produce no release.

on:
  workflow_dispatch:

permissions:
  contents: write # create tags, releases, and push the version-bump commit
  issues: write # semantic-release may comment on related issues
  pull-requests: write # ...and on related PRs

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (required by Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.3
          cache: true

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Version-bump commit is authored by the repo owner (no bot watermark).
          GIT_AUTHOR_NAME: fery
          GIT_AUTHOR_EMAIL: adefery221@gmail.com
          GIT_COMMITTER_NAME: fery
          GIT_COMMITTER_EMAIL: adefery221@gmail.com
        run: npx semantic-release
